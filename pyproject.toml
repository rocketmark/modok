[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modok"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "click>=8.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.139.2",
    "uvicorn>=0.29",
]

[project.scripts]
modok = "modok.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.161.5",
    "anyio>=4.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"
